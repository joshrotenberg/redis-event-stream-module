name: Release artifacts

# contents: write         - upload artifacts to the release.
# id-token: write         - OIDC token for keyless Sigstore signing (#104).
# attestations: write     - store the build-provenance attestation (#104).
# packages: write         - push the preloaded image to GHCR (#102).
permissions:
  contents: write
  id-token: write
  attestations: write
  # Required for the docker job to push the preloaded image to GHCR with the
  # workflow's GITHUB_TOKEN (issue #102).
  packages: write

on:
  # Called directly by release-please.yml after Release Please creates the
  # tag and GitHub release. Direct invocation works with either the built-in
  # GITHUB_TOKEN or a configured PAT and cannot double-run from a release event.
  workflow_call:
    inputs:
      tag:
        description: "Release tag to upload artifacts to."
        required: true
        type: string
      publish:
        description: "Publish artifacts and images; false performs a native dry run."
        required: false
        default: true
        type: boolean
  # Recovery path for rebuilding or reattaching artifacts to an existing
  # release without recreating its tag or release notes. `publish: false`
  # exercises the same native builds and smoke tests without writing a release
  # or GHCR, which makes latency changes measurable before rollout (#272).
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to upload artifacts to."
        required: true
        type: string
      publish:
        description: "Publish artifacts and images; disable for a release-equivalent dry run."
        required: false
        default: true
        type: boolean
  # Self-validation: build (but do not upload to a release or push an image)
  # whenever this workflow, the Dockerfile, or the RAMP manifest changes in a
  # PR, so runner, build, image, and packaging breakage is caught before a
  # release depends on it.
  pull_request:
    paths:
      - ".github/workflows/release-artifacts.yml"
      - "Dockerfile"
      - "ramp.yml"

env:
  CARGO_TERM_COLOR: always
  # Passed explicitly to the Docker build and included in its cache scope so
  # changing the image toolchain cannot accidentally reuse an older compiler
  # layer (issue #272). Keep this aligned with Dockerfile's default.
  IMAGE_RUST_VERSION: "1.88"

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 rather than -latest: older glibc (2.35) for wider
          # compatibility of the prebuilt .so.
          - name: linux-x86_64
            runner: ubuntu-22.04
            ext: so
          - name: linux-aarch64
            runner: ubuntu-22.04-arm
            ext: so
          - name: macos-aarch64
            runner: macos-14
            ext: dylib
          # No Intel macOS runner exists (macos-13 is retired), so x86_64 macOS
          # is cross-compiled from the arm64 runner (#101). A musl leg for
          # Alpine/musl Redis images is deliberately left to a follow-up: it
          # serves only musl-linked servers, not older-glibc hosts (the
          # ubuntu-22.04 pin already covers those), and its smoke test needs an
          # Alpine container.
          - name: macos-x86_64
            runner: macos-14
            ext: dylib
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build release cdylib
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --target "${{ matrix.target }}"
          else
            cargo build --release
          fi

      - name: Package artifact with checksum
        id: pkg
        run: |
          set -euo pipefail
          VERSION="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(p["version"] for p in d["packages"] if p["name"]=="redis-event-stream-module"))')"
          NAME="redis-event-stream-module-${VERSION}-${{ matrix.name }}.${{ matrix.ext }}"
          if [ -n "${{ matrix.target }}" ]; then
            SRC="target/${{ matrix.target }}/release/libredis_event_stream_module.${{ matrix.ext }}"
          else
            SRC="target/release/libredis_event_stream_module.${{ matrix.ext }}"
          fi
          mkdir -p dist
          cp "${SRC}" "dist/${NAME}"
          cd dist
          shasum -a 256 "${NAME}" > "${NAME}.sha256"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          shasum -a 256 -c "${NAME}.sha256"

      # The consumer client binary (issue #82), so operators get the
      # discovery/merge/verification tooling without a Rust toolchain. Built by
      # the same `cargo build --release[ --target]` above (it is a workspace
      # member); this step just packages it with a checksum. No extension:
      # eventstream-client is a native executable on both Linux and macOS.
      - name: Package the consumer client binary with checksum
        id: client
        run: |
          set -euo pipefail
          VERSION="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(p["version"] for p in d["packages"] if p["name"]=="eventstream-client"))')"
          NAME="eventstream-client-${VERSION}-${{ matrix.name }}"
          if [ -n "${{ matrix.target }}" ]; then
            SRC="target/${{ matrix.target }}/release/eventstream-client"
          else
            SRC="target/release/eventstream-client"
          fi
          mkdir -p dist
          cp "${SRC}" "dist/${NAME}"
          cd dist
          shasum -a 256 "${NAME}" > "${NAME}.sha256"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          shasum -a 256 -c "${NAME}.sha256"

      # Attest each uploaded artifact so consumers can trace the .so/.dylib and
      # the client binary back to this repo, commit, and workflow run (#104).
      # Skipped on PR and publish=false validation paths, which build but never
      # upload: attesting a throwaway artifact is noise.
      - name: Attest build provenance
        if: github.event_name != 'pull_request' && inputs.publish
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/${{ steps.pkg.outputs.name }}
            dist/${{ steps.client.outputs.name }}

      - name: Smoke test the artifact loads
        # Cross-compiled legs (matrix.target set) cannot run natively here, and
        # Rosetta only helps with an x86_64 redis-server; skip the load smoke,
        # mirroring the too-old-distro skip below.
        if: matrix.target == ''
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y redis-server redis-tools || true
          else
            brew install redis
          fi
          # Distro Redis can predate 7.2; only smoke-test where it is new enough.
          MAJOR="$(redis-server --version | sed -E 's/.*v=([0-9]+)\..*/\1/')"
          MINOR="$(redis-server --version | sed -E 's/.*v=[0-9]+\.([0-9]+).*/\1/')"
          if [ "$MAJOR" -lt 7 ] || { [ "$MAJOR" -eq 7 ] && [ "$MINOR" -lt 2 ]; }; then
            echo "redis-server ${MAJOR}.${MINOR} < 7.2; skipping load smoke (CI matrix covers it)"
            exit 0
          fi
          DIR="$(mktemp -d)"
          redis-server --port 6397 --dir "$DIR" --daemonize yes --logfile "$DIR/l.log" \
            --loadmodule "$PWD/dist/${{ steps.pkg.outputs.name }}"
          sleep 1
          redis-cli -p 6397 MODULE LIST | grep -q eventstream
          redis-cli -p 6397 SHUTDOWN NOSAVE || true
          echo "artifact loads cleanly"

      - name: Upload to the release
        # workflow_call from Release Please or a publishing recovery dispatch.
        if: github.event_name != 'pull_request' && inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$TAG" \
            "dist/${{ steps.pkg.outputs.name }}" \
            "dist/${{ steps.pkg.outputs.name }}.sha256" \
            "dist/${{ steps.client.outputs.name }}" \
            "dist/${{ steps.client.outputs.name }}.sha256" \
            --clobber

      - name: Upload as workflow artifact (validation runs)
        if: github.event_name == 'pull_request' || inputs.publish == false
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: dist/
          retention-days: 5

  # Preloaded container image (issues #102, #272). Each server/architecture is
  # built on its native runner, in parallel: compiling Rust and the server
  # under QEMU made the v0.5.0 release tail 28-46 minutes. Publishing builds
  # push unnamed content-addressed images; `docker-manifest` assembles their
  # two digests under the versioned and moving tags only after both native
  # module-load smoke tests pass. PRs and publish=false dispatches load and
  # smoke the same four native builds locally without touching GHCR.
  docker:
    name: docker image (${{ matrix.image }}, ${{ matrix.arch }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Server versions remain pinned to the CI integration matrix (SPEC.md
          # section 14). Explicit entries make runner/architecture provenance
          # and the final digest grouping unambiguous.
          - image: redis
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-22.04
            server_kind: redis
            server_version: "8.8.0"
          - image: redis
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-22.04-arm
            server_kind: redis
            server_version: "8.8.0"
          - image: valkey8
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-22.04
            server_kind: valkey
            server_version: "8.1.6"
          - image: valkey8
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-22.04-arm
            server_kind: valkey
            server_version: "8.1.6"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Derive image metadata
        id: meta
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "image=${IMAGE}"
            echo "local-tag=eventstream-ci:${{ matrix.image }}-${{ matrix.arch }}"
          } >> "$GITHUB_OUTPUT"

      - name: Start image timing
        id: timing
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        # Release Please and normal recovery dispatches publish. PRs and
        # publish=false recovery dry runs never log in or write registry data.
        if: github.event_name != 'pull_request' && inputs.publish
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Validation uses one native platform per runner, so buildx can load the
      # result into Docker without QEMU or a multi-platform image store.
      - name: Build image (validation, load locally)
        id: build-validation
        if: github.event_name == 'pull_request' || inputs.publish == false
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          build-args: |
            RUST_VERSION=${{ env.IMAGE_RUST_VERSION }}
            SERVER_KIND=${{ matrix.server_kind }}
            SERVER_VERSION=${{ matrix.server_version }}
          tags: ${{ steps.meta.outputs.local-tag }}
          cache-from: type=gha,scope=image-${{ matrix.server_kind }}-${{ matrix.server_version }}-${{ matrix.arch }}-rust-${{ env.IMAGE_RUST_VERSION }}-${{ hashFiles('Cargo.lock', 'Dockerfile') }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.server_kind }}-${{ matrix.server_version }}-${{ matrix.arch }}-rust-${{ env.IMAGE_RUST_VERSION }}-${{ hashFiles('Cargo.lock', 'Dockerfile') }}

      # Release builds push by digest, not tag. That lets four native jobs run
      # independently while preventing a partially tested architecture from
      # becoming the versioned/moving image. Explicit max-mode provenance is
      # at least as strong as the former one-shot build-push-action invocation.
      - name: Build and push image by digest (release)
        id: build-release
        if: github.event_name != 'pull_request' && inputs.publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            RUST_VERSION=${{ env.IMAGE_RUST_VERSION }}
            SERVER_KIND=${{ matrix.server_kind }}
            SERVER_VERSION=${{ matrix.server_version }}
          outputs: type=image,name=${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          cache-from: type=gha,scope=image-${{ matrix.server_kind }}-${{ matrix.server_version }}-${{ matrix.arch }}-rust-${{ env.IMAGE_RUST_VERSION }}-${{ hashFiles('Cargo.lock', 'Dockerfile') }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.server_kind }}-${{ matrix.server_version }}-${{ matrix.arch }}-rust-${{ env.IMAGE_RUST_VERSION }}-${{ hashFiles('Cargo.lock', 'Dockerfile') }}

      - name: Pull release digest for native smoke test
        if: github.event_name != 'pull_request' && inputs.publish
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build-release.outputs.digest }}
        run: docker pull "${IMAGE}@${DIGEST}"

      - name: Smoke test the native image loads the module
        id: smoke
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build-release.outputs.digest }}
          LOCAL_TAG: ${{ steps.meta.outputs.local-tag }}
          PUBLISH: ${{ github.event_name != 'pull_request' && inputs.publish }}
        run: |
          set -euo pipefail
          container="es-smoke-${{ matrix.image }}-${{ matrix.arch }}"
          if [ "$PUBLISH" = "true" ]; then
            image_ref="${IMAGE}@${DIGEST}"
          else
            image_ref="$LOCAL_TAG"
          fi
          # On failure, preserve the server's own loadmodule diagnostics.
          trap 'echo "=== native image smoke logs ==="; docker logs "$container" 2>&1 || true; docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker run --platform "${{ matrix.platform }}" -d --name "$container" "$image_ref"
          for _ in $(seq 1 20); do
            if docker exec "$container" redis-cli PING 2>/dev/null | grep -q PONG; then
              break
            fi
            sleep 0.5
          done
          docker exec "$container" redis-cli MODULE LIST | grep -q eventstream
          echo "${{ matrix.platform }} image loads the module cleanly"

      - name: Export release digest
        if: github.event_name != 'pull_request' && inputs.publish
        env:
          DIGEST: ${{ steps.build-release.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload release digest
        if: github.event_name != 'pull_request' && inputs.publish
        uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Record image timing
        if: always()
        env:
          STARTED: ${{ steps.timing.outputs.started }}
        run: |
          set -euo pipefail
          started="${STARTED:-$(date +%s)}"
          elapsed=$(( $(date +%s) - started ))
          {
            echo "### ${{ matrix.image }} / ${{ matrix.arch }}"
            echo
            echo "- platform: \`${{ matrix.platform }}\`"
            echo "- elapsed: ${elapsed}s"
            echo "- validation build: \`${{ steps.build-validation.outcome }}\`"
            echo "- release build: \`${{ steps.build-release.outcome }}\`"
            echo "- native load smoke: \`${{ steps.smoke.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Assemble only fully-built, natively smoke-tested digests. The two server
  # variants remain independent manifests with their existing tags.
  docker-manifest:
    name: docker manifest (${{ matrix.image }})
    if: github.event_name != 'pull_request' && inputs.publish
    needs: docker
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: redis
            suffix: ""
          - image: valkey8
            suffix: "-valkey8"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Derive manifest metadata
        id: meta
        run: |
          set -euo pipefail
          VERSION="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(p["version"] for p in d["packages"] if p["name"]=="redis-event-stream-module"))')"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SUFFIX="${{ matrix.suffix }}"
          TAGS="${IMAGE}:${VERSION}${SUFFIX}"
          if [ -n "$SUFFIX" ]; then
            TAGS="${TAGS},${IMAGE}:latest${SUFFIX}"
          else
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          {
            echo "image=${IMAGE}"
            echo "version-tag=${IMAGE}:${VERSION}${SUFFIX}"
            echo "tags=${TAGS}"
          } >> "$GITHUB_OUTPUT"

      - name: Download architecture digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: image-digest-${{ matrix.image }}-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create versioned and moving manifests
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          mapfile -t digests < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          if [ "${#digests[@]}" -ne 2 ]; then
            echo "expected two architecture digests, found ${#digests[@]}" >&2
            exit 1
          fi
          tag_args=()
          IFS=',' read -ra tags <<< "$TAGS"
          for tag in "${tags[@]}"; do
            tag_args+=(--tag "$tag")
          done
          sources=()
          for digest in "${digests[@]}"; do
            sources+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

      - name: Verify both published architectures
        env:
          VERSION_TAG: ${{ steps.meta.outputs.version-tag }}
        run: |
          set -euo pipefail
          actual="$(docker buildx imagetools inspect --raw "$VERSION_TAG" \
            | jq -r '.manifests[] | select(.platform.os == "linux") | "\(.platform.os)/\(.platform.architecture)"' \
            | sort -u)"
          expected="$(printf 'linux/amd64\nlinux/arm64')"
          if [ "$actual" != "$expected" ]; then
            echo "unexpected manifest platforms:" >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi
          docker buildx imagetools inspect "$VERSION_TAG"

  # Redis Enterprise RAMP bundle (issue #103). Enterprise is linux-only and
  # does not load a bare .so; `ramp pack` wraps it with a generated module.json
  # into the zip that `POST /v1/modules` accepts. ramp-packer loads the module
  # into a throwaway redis-server to enumerate commands, so a redis-server 7.2+
  # must be on PATH (distro redis on ubuntu predates 7.2 and would abort the
  # load per SPEC.md section 14, so redis is installed from packages.redis.io).
  # The bundle still requires validation against a real Enterprise database
  # before the first release that ships it (issue #103, step 3).
  ramp:
    name: ramp package (linux-x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install ramp-packer and a modern redis-server
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          set -euo pipefail
          pip install --retries 3 --timeout 30 ramp-packer
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y lsb-release curl gpg
          curl --retry 3 --retry-all-errors --connect-timeout 10 --max-time 60 \
            -fsSL https://packages.redis.io/gpg \
            | sudo gpg --batch --yes --dearmor \
              -o /usr/share/keyrings/redis-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/redis-archive-keyring.gpg] https://packages.redis.io/deb $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/redis.list
          sudo apt-get -o Acquire::Retries=3 update
          # The runner only needs the binary. Prevent the package post-install
          # from trying to start a long-lived system service.
          printf '#!/bin/sh\nexit 101\n' \
            | sudo tee /usr/sbin/policy-rc.d >/dev/null
          sudo chmod 0755 /usr/sbin/policy-rc.d
          sudo apt-get -o Acquire::Retries=3 install -y redis
          redis-server --version

      - name: Build release cdylib
        # -p scopes the build to the module package: the RAMP bundle wraps only
        # the module .so, so the consumer client crate (issue #82) need not be
        # compiled here.
        run: cargo build --release --lib -p redis-event-stream-module

      - name: Pack the RAMP bundle with checksum
        id: pkg
        run: |
          set -euo pipefail
          VERSION="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(p["version"] for p in d["packages"] if p["name"]=="redis-event-stream-module"))')"
          SO="redis-event-stream-module-${VERSION}-linux-x86_64.so"
          ZIP="redis-event-stream-module-${VERSION}-linux-x86_64.zip"
          mkdir -p dist
          cp target/release/libredis_event_stream_module.so "dist/${SO}"
          # ramp pack loads the module to extract commands/version; manifest
          # drift (e.g. a new command) surfaces here, on PR, not at release.
          ramp pack "dist/${SO}" -m ramp.yml -o "dist/${ZIP}"
          cd dist
          shasum -a 256 "${ZIP}" > "${ZIP}.sha256"
          shasum -a 256 -c "${ZIP}.sha256"
          echo "zip=${ZIP}" >> "$GITHUB_OUTPUT"

      - name: Upload to the release
        # Mirror the .so upload for Release Please and manual recovery runs.
        if: github.event_name != 'pull_request' && inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$TAG" \
            "dist/${{ steps.pkg.outputs.zip }}" \
            "dist/${{ steps.pkg.outputs.zip }}.sha256" \
            --clobber

      - name: Upload as workflow artifact (validation runs)
        if: github.event_name == 'pull_request' || inputs.publish == false
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.zip }}
          path: dist/
          retention-days: 5

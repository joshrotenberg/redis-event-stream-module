[package]
name = "eventstream-webhook-sink"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "Reference at-least-once webhook sink for redis-event-stream-module"
license = "MIT OR Apache-2.0"

# Keep the connector's HTTP dependency graph out of the module workspace.
[workspace]
resolver = "2"

[dependencies]
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
eventstream-client = { path = "../../crates/eventstream-client" }
redis = { version = "1.3", features = ["streams"] }
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "json",
    "rustls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
